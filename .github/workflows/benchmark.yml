name: Parser benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bench/**"
      - "src/log-contract.ts"
      - "src/parser.ts"
      - "src/timestamp.ts"
      - "src/types.ts"
      - "test/benchmark.test.ts"
      - "BENCHMARKS.md"
      - "README.md"
      - "CHANGELOG.md"
      - "bun.lock"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/benchmark.yml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: parser-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.repository == 'XJM-free/claude-agent-ledger'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Run full parser benchmark
        shell: bash
        run: |
          set -o pipefail
          bun run benchmark -- --profile full --check --require-clean \
            --output parser-benchmark.json | tee parser-benchmark.md
      - name: Add benchmark table to job summary
        if: ${{ always() && hashFiles('parser-benchmark.md') != '' }}
        run: cat parser-benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized receipt
        if: ${{ always() && hashFiles('parser-benchmark.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parser-benchmark-${{ runner.os }}-${{ runner.arch }}
          path: parser-benchmark.json
          if-no-files-found: error
          retention-days: 30
